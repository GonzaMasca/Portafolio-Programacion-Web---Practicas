<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio de Prácticas de Programación WEB</title>
<style>
  :root {
    --radio: 14px;
    --acento: oklch(0.74 0.13 195);
    --acento-suave: oklch(0.74 0.13 195 / 0.14);
    --tipo: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --transicion: 220ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  html[data-tema="oscuro"] {
    --fondo: oklch(0.17 0.012 250);
    --panel: oklch(0.215 0.014 250);
    --panel-alto: oklch(0.26 0.015 250);
    --borde: oklch(0.32 0.015 250);
    --texto: oklch(0.95 0.005 250);
    --texto-suave: oklch(0.72 0.012 250);
    --sombra: 0 1px 2px oklch(0 0 0 / 0.4), 0 12px 32px oklch(0 0 0 / 0.35);
    --esquema: dark;
  }
  html[data-tema="claro"] {
    --fondo: oklch(0.968 0.004 250);
    --panel: oklch(1 0 0);
    --panel-alto: oklch(0.955 0.005 250);
    --borde: oklch(0.89 0.006 250);
    --texto: oklch(0.24 0.012 250);
    --texto-suave: oklch(0.52 0.012 250);
    --sombra: 0 1px 2px oklch(0.2 0.02 250 / 0.06), 0 10px 30px oklch(0.2 0.02 250 / 0.08);
    --esquema: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--tipo);
    color: var(--texto);
    background: var(--fondo);
    color-scheme: var(--esquema);
    -webkit-font-smoothing: antialiased;
    transition: background var(--transicion), color var(--transicion);
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  /* ---------- Barra superior ---------- */
  header.barra {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 28px;
    border-bottom: 1px solid var(--borde);
    background: color-mix(in oklab, var(--panel) 70%, transparent);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .marca { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .punto {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: linear-gradient(140deg, var(--acento), color-mix(in oklab, var(--acento) 45%, var(--panel)));
    box-shadow: 0 0 0 1px var(--borde) inset;
  }
  .marca h1 {
    font-size: 1.02rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .marca span {
    display: block;
    font: 500 0.72rem/1.3 var(--mono);
    color: var(--texto-suave);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  #botonTema {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 0.82rem var(--tipo);
    color: var(--texto);
    background: var(--panel-alto);
    border: 1px solid var(--borde);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    transition: background var(--transicion), border-color var(--transicion), transform var(--transicion);
  }
  #botonTema:hover { border-color: var(--acento); transform: translateY(-1px); }
  #botonTema:active { transform: translateY(0); }
  #botonTema:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .icono { width: 15px; height: 15px; display: block; fill: none; stroke: currentColor; stroke-width: 1.7; }

  /* ---------- Layout ---------- */
  .contenedor {
    flex: 1;
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 22px;
    padding: 22px 28px 28px;
    align-items: start;
    min-height: 0;
  }

  aside {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: sticky;
    top: 90px;
  }
  .rotulo {
    font: 600 0.7rem/1 var(--mono);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--texto-suave);
  }
  .campo { position: relative; }
  .campo::after {
    content: "";
    position: absolute;
    right: 15px; top: 50%;
    width: 7px; height: 7px;
    margin-top: -5px;
    border-right: 1.8px solid var(--texto-suave);
    border-bottom: 1.8px solid var(--texto-suave);
    transform: rotate(45deg);
    pointer-events: none;
  }
  select {
    appearance: none;
    width: 100%;
    padding: 13px 40px 13px 15px;
    font: 500 0.95rem var(--tipo);
    color: var(--texto);
    background: var(--panel-alto);
    border: 1px solid var(--borde);
    border-radius: 11px;
    cursor: pointer;
    transition: border-color var(--transicion), box-shadow var(--transicion);
  }
  select:hover { border-color: color-mix(in oklab, var(--acento) 60%, var(--borde)); }
  select:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 4px var(--acento-suave); }

  .nota {
    font-size: 0.82rem;
    line-height: 1.55;
    color: var(--texto-suave);
    margin: 0;
    text-wrap: pretty;
  }
  .separador { height: 1px; background: var(--borde); border: 0; margin: 2px 0; }
  .contador {
    display: inline-flex; align-items: center; gap: 7px;
    font: 500 0.78rem var(--mono);
    color: var(--texto-suave);
  }
  .contador b { color: var(--texto); font-weight: 600; }

  /* ---------- Panel de contenido ---------- */
  main {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 480px;
  }
  .panel-cabecera {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 13px 18px;
    border-bottom: 1px solid var(--borde);
    background: var(--panel-alto);
  }
  .titulo-practica { font-size: 0.92rem; font-weight: 600; letter-spacing: -0.01em; }
  .etiqueta {
    font: 600 0.68rem/1 var(--mono);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 6px 9px;
    border-radius: 7px;
    background: var(--acento-suave);
    color: color-mix(in oklab, var(--acento) 75%, var(--texto));
    border: 1px solid color-mix(in oklab, var(--acento) 35%, transparent);
  }
  .ruta {
    margin-left: auto;
    font: 500 0.75rem var(--mono);
    color: var(--texto-suave);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lienzo { flex: 1; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  iframe {
    width: 100%;
    height: 68vh;
    min-height: 420px;
    border: 1px solid var(--borde);
    border-radius: 10px;
    background: oklch(1 0 0);
    animation: aparecer 300ms var(--transicion) both;
  }

  /* Consola embebida (tipo "js") */
  .consola {
    display: none;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    border: 1px solid var(--borde);
    border-radius: 10px;
    background: color-mix(in oklab, var(--texto) 4%, var(--panel-alto));
    overflow: hidden;
    animation: aparecer 300ms var(--transicion) both;
  }
  .consola.visible { display: flex; }
  .consola-cabecera {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--borde);
  }
  .consola-cabecera .rotulo { letter-spacing: 0.11em; }
  .consola-cabecera .cuenta {
    font: 500 0.72rem var(--mono);
    color: var(--texto-suave);
    margin-right: auto;
  }
  #botonLimpiar {
    font: 500 0.74rem var(--mono);
    color: var(--texto-suave);
    background: transparent;
    border: 1px solid var(--borde);
    border-radius: 7px;
    padding: 5px 10px;
    cursor: pointer;
    transition: color var(--transicion), border-color var(--transicion);
  }
  #botonLimpiar:hover { color: var(--texto); border-color: var(--acento); }
  #botonLimpiar:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  #salidaConsola {
    flex: 1;
    min-height: 200px;
    overflow: auto;
    padding: 8px 0;
    font: 500 0.82rem/1.6 var(--mono);
  }
  .linea {
    display: flex;
    gap: 12px;
    padding: 3px 14px;
    white-space: pre-wrap;
    word-break: break-word;
    border-left: 2px solid transparent;
  }
  .linea:hover { background: color-mix(in oklab, var(--texto) 4%, transparent); }
  .linea .n { color: var(--texto-suave); opacity: 0.55; min-width: 24px; text-align: right; flex: none; user-select: none; }
  .linea.error { border-left-color: oklch(0.68 0.16 25); color: oklch(0.68 0.16 25); background: oklch(0.68 0.16 25 / 0.07); }
  .linea.warn  { border-left-color: oklch(0.76 0.13 85); color: oklch(0.7 0.13 85); }
  .linea.info  { color: color-mix(in oklab, var(--acento) 80%, var(--texto)); }
  .vacio { padding: 26px 14px; color: var(--texto-suave); opacity: 0.7; }
  .info {
    margin: 0;
    display: none;
    padding: 9px 14px;
    border-top: 1px solid var(--borde);
    font: 500 0.76rem/1.5 var(--mono);
    color: var(--texto-suave);
  }
  .info:not(:empty) { display: block; }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  footer {
    padding: 0 28px 24px;
    font: 500 0.75rem var(--mono);
    color: var(--texto-suave);
  }

  @media (max-width: 860px) {
    header.barra { padding: 14px 16px; }
    .contenedor { grid-template-columns: 1fr; padding: 16px; gap: 16px; }
    aside { position: static; padding: 16px; }
    main { min-height: 0; }
    .lienzo { padding: 12px; }
    iframe { height: 60vh; min-height: 320px; }
    .ruta { margin-left: 0; width: 100%; }
    footer { padding: 0 16px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <header class="barra">
    <div class="marca">
      <div class="punto" aria-hidden="true"></div>
      <div>
        <span>Programación Web</span>
        <h1>Portfolio de Prácticas</h1>
      </div>
    </div>
    <button id="botonTema" type="button" aria-live="polite">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"></path></svg>
      <span id="textoTema">Modo claro</span>
    </button>
  </header>

  <div class="contenedor">
    <aside>
      <label class="rotulo" for="selectorPractica">Elegí una práctica</label>
      <div class="campo">
        <select id="selectorPractica"></select>
      </div>
      <p class="nota">Las prácticas HTML se abren en el visor. Las de tipo JS se ejecutan en esta página e imprimen su resultado en la consola del navegador.</p>
      <hr class="separador">
      <span class="contador"><b id="totalPracticas">0</b> prácticas cargadas</span>
    </aside>

    <main>
      <div class="panel-cabecera">
        <span class="titulo-practica" id="tituloPractica">—</span>
        <span class="etiqueta" id="tipoPractica">—</span>
        <span class="ruta" id="rutaPractica"></span>
      </div>
      <div class="lienzo">
        <iframe id="visorPractica" title="Vista de la práctica"></iframe>
        <div class="consola" id="consolaPractica">
          <div class="consola-cabecera">
            <span class="rotulo">Consola</span>
            <span class="cuenta" id="cuentaLineas">0 líneas</span>
            <button id="botonLimpiar" type="button">Limpiar</button>
          </div>
          <div id="salidaConsola" role="log" aria-live="polite"></div>
          <p class="info" id="infoPractica"></p>
        </div>
      </div>
    </main>
  </div>

  <footer>Facultad · Prácticas de Programación Web</footer>

  <script>
    // -----------------------------------------------------------------
    // Registro de prácticas. Para sumar una nueva:
    //   1) Creá la carpeta practicas/<id>/ y poné ahí el/los archivo(s).
    //   2) Agregá un objeto acá con:
    //        id      -> identificador único
    //        nombre  -> texto que se ve en el combo box
    //        tipo    -> "html" si es una página completa, "js" si es un
    //                   script que solo imprime resultados por consola
    //        archivo -> ruta relativa al archivo .html o .js
    // -----------------------------------------------------------------
    const practicas = [
      { id: "a1",   nombre: "Práctica a1",   tipo: "html", archivo: "practicas/a1/PWEB-Practica-a1.html" },
      { id: "a2",   nombre: "Práctica a2",   tipo: "js",   archivo: "practicas/a2/PWEB-Practica-a2.js" },
      { id: "a4_2", nombre: "Práctica a4_2", tipo: "js",   archivo: "practicas/a4_2/PWEB-Practica-a4_2.js" },
      { id: "a4_3", nombre: "Práctica a4_3", tipo: "js",   archivo: "practicas/a4_3/PWEB-Practica-a4_3.js" },
      { id: "a4_4", nombre: "Práctica a4_4", tipo: "js",   archivo: "practicas/a4_4/PWEB-Practica-a4_4.js" },
      { id: "a4_41", nombre: "Práctica a4_41", tipo: "js",   archivo: "practicas/a4_41/PWEB-Practica-a4_41.js" },
      { id: "a4_42", nombre: "Práctica a4_42", tipo: "js",   archivo: "practicas/a4_42/PWEB-Practica-a4_42.js" },
      { id: "a4_43", nombre: "Práctica a4_43", tipo: "js",   archivo: "practicas/a4_43/PWEB-Practica-a4_43.js" },
      { id: "a4_44", nombre: "Práctica a4_44", tipo: "js",   archivo: "practicas/a4_44/PWEB-Practica-a4_44.js" },
      { id: "a4_441", nombre: "Práctica a4_441", tipo: "js",   archivo: "practicas/a4_441/PWEB-Practica-a4_441.js" },
      { id: "4_442", nombre: "Práctica 4_442", tipo: "js",   archivo: "practicas/4_442/4_442.js" },
      { id: "4_443", nombre: "Práctica 4_443", tipo: "html",   archivo: "practicas/4_443/4_443.html" },
      { id: "practicas_objetos_2", nombre: "Práctica Objetos 2", tipo: "js",   archivo: "practicas/practica_objetos_2/practicas_objetos_2.js" },
      { id: "practicas_objetos_3", nombre: "Práctica Objetos 3", tipo: "js",   archivo: "practicas/practicas_objetos_3/practicas_objetos_3.js" },
      { id: "practicas_objetos_4", nombre: "Práctica Objetos 4", tipo: "js",   archivo: "practicas/practicas_objetos_4/practicas_objetos_4.js" },
      { id: "practica_observers_1", nombre: "Práctica Observer 1", tipo: "js",   archivo: "practicas/practica_observers_1/practica_observers_1.js" },
      { id: "practicas_intersection_observers", nombre: "Práctica Intersection Observers", tipo: "html",   archivo: "practicas/practicas_intersection_observers/practicas_intersection_observers.html" },
      { id: "practicas_performance_observer", nombre: "Práctica Performance Observer", tipo: "html",   archivo: "practicas/practicas_performance_observer/practicas_performance_observer.html" },
      // Copiamos esta sintaxis para agregar un nuevo ejercicios { id: "a5", nombre: "Práctica a5", tipo: "html", archivo: "practicas/a5/PWEB-Practica-a5.html" },
    ];

    const select = document.getElementById("selectorPractica");
    const iframe = document.getElementById("visorPractica");
    const info = document.getElementById("infoPractica");
  
    practicas.forEach(p => {
      const option = document.createElement("option");
      option.value = p.id;
      option.textContent = p.nombre;
      select.appendChild(option);
    });

    // Sandbox: cada práctica "js" corre en un iframe nuevo y descartable,
    // así cada carga tiene su propio scope de JS y nunca choca con
    // declaraciones (const/let) de una carga anterior.
    let sandbox = null;

    function ejecutarScriptJS(archivo) {
      if (sandbox) sandbox.remove();

      sandbox = document.createElement("iframe");
      sandbox.style.display = "none";
      sandbox.title = "Entorno de ejecución de la práctica";
      document.body.appendChild(sandbox);

      const ventana = sandbox.contentWindow;
      const documento = sandbox.contentDocument;

      ["log", "info", "warn", "error"].forEach((metodo) => {
        ventana.console[metodo] = function () {
          pintarLinea(arguments, metodo === "log" ? "" : metodo);
        };
      });
      ventana.addEventListener("error", (e) => pintarLinea([e.message], "error"));

      const script = documento.createElement("script");
      script.src = archivo + "?t=" + Date.now();
      documento.body.appendChild(script);
    }

    function mostrarPractica(id) {
      const practica = practicas.find(p => p.id === id);
      if (!practica) return;

      if (practica.tipo === "html") {
        iframe.style.display = "block";
        iframe.src = practica.archivo;
        info.textContent = "";
      } else {
        iframe.style.display = "none";
        iframe.src = "about:blank";
        ejecutarScriptJS(practica.archivo);
        info.textContent = "Práctica cargada. Mirá el resultado en la consola de abajo.";
      }
    }

    select.addEventListener("change", (e) => mostrarPractica(e.target.value));

    if (practicas.length > 0) {
      select.value = practicas[0].id;
      mostrarPractica(practicas[0].id);
    }

    // -----------------------------------------------------------------
    // Solo presentación: encabezado del panel, contador y tema.
    // No interviene en la lógica de carga de prácticas.
    // -----------------------------------------------------------------
    document.getElementById("totalPracticas").textContent = practicas.length;

    const titulo = document.getElementById("tituloPractica");
    const etiqueta = document.getElementById("tipoPractica");
    const ruta = document.getElementById("rutaPractica");

    function actualizarCabecera(id) {
      const practica = practicas.find(p => p.id === id);
      if (!practica) return;
      titulo.textContent = practica.nombre;
      etiqueta.textContent = practica.tipo === "html" ? "Página HTML" : "Script JS";
      ruta.textContent = practica.archivo;
    }

    select.addEventListener("change", (e) => actualizarCabecera(e.target.value));
    if (practicas.length > 0) actualizarCabecera(select.value);

    // ---- Consola embebida: refleja lo que las prácticas "js" imprimen ----
    const consola = document.getElementById("consolaPractica");
    const salida = document.getElementById("salidaConsola");
    const cuenta = document.getElementById("cuentaLineas");
    let lineas = 0;

    function textoVacio() {
      salida.innerHTML = '<div class="vacio">Sin salida todavía.</div>';
    }

    function limpiarConsola() {
      lineas = 0;
      cuenta.textContent = "0 líneas";
      textoVacio();
    }

    function formatear(valor) {
      if (typeof valor === "string") return valor;
      if (valor instanceof Error) return valor.name + ": " + valor.message;
      if (typeof valor === "function") return valor.toString();
      try { return JSON.stringify(valor, null, 2); } catch (e) { return String(valor); }
    }

    function pintarLinea(args, nivel) {
      if (lineas === 0) salida.innerHTML = "";
      lineas++;
      const fila = document.createElement("div");
      fila.className = "linea" + (nivel ? " " + nivel : "");
      const num = document.createElement("span");
      num.className = "n";
      num.textContent = lineas;
      const cuerpo = document.createElement("span");
      cuerpo.textContent = Array.prototype.map.call(args, formatear).join(" ");
      fila.appendChild(num);
      fila.appendChild(cuerpo);
      salida.appendChild(fila);
      salida.scrollTop = salida.scrollHeight;
      cuenta.textContent = lineas + (lineas === 1 ? " línea" : " líneas");
    }

    function prepararConsola(id) {
      const practica = practicas.find(p => p.id === id);
      if (!practica) return;
      consola.classList.toggle("visible", practica.tipo === "js");
      if (practica.tipo === "js") limpiarConsola();
    }

    document.getElementById("botonLimpiar").addEventListener("click", limpiarConsola);
    select.addEventListener("change", (e) => prepararConsola(e.target.value));
    if (practicas.length > 0) prepararConsola(select.value);

    const raiz = document.documentElement;
    const botonTema = document.getElementById("botonTema");
    const textoTema = document.getElementById("textoTema");

    function aplicarTema(tema) {
      raiz.dataset.tema = tema;
      textoTema.textContent = tema === "oscuro" ? "Modo claro" : "Modo oscuro";
      botonTema.setAttribute("aria-label", "Cambiar a " + (tema === "oscuro" ? "modo claro" : "modo oscuro"));
      try { localStorage.setItem("tema-portfolio", tema); } catch (e) {}
    }

    let temaInicial = null;
    try { temaInicial = localStorage.getItem("tema-portfolio"); } catch (e) {}
    if (!temaInicial) {
      temaInicial = window.matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "oscuro";
    }
    aplicarTema(temaInicial);

    botonTema.addEventListener("click", () => {
      aplicarTema(raiz.dataset.tema === "oscuro" ? "claro" : "oscuro");
    });
  </script>
</body>
</html>
