<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IntersectionObserver</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 400px;
            padding: 100px 0;
        }

        .caja {
            width: 300px;
            height: 150px;
            background-color: #4caf50;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            /* Estado inicial: invisible y corrida hacia abajo. transition define cómo anima al cambiar. */
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        /* Estado final cuando el JS agrega esta clase: opacity y transform vuelven a su valor normal, */
        /* y como hay transition definida arriba, el cambio se ve animado en vez de instantáneo. */
        .caja.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="caja">Caja 1</div>
<div class="caja">Caja 2</div>
<div class="caja">Caja 3</div>
<div class="caja">Caja 4</div>
<div class="caja">Caja 5</div>

<script>
    const cajas = document.querySelectorAll(".caja");

    // IntersectionObserver avisa cuando un elemento entra o sale del viewport (lo que se ve en pantalla).
    // "entradas" es la lista de cajas que cambiaron de estado en ese momento.
    const observer = new IntersectionObserver(entradas => {
        entradas.forEach(entrada => {
            // isIntersecting es true cuando el elemento ya es visible en pantalla.
            if (entrada.isIntersecting) {
                // Le agrega la clase "visible", que en el CSS dispara la animación (opacity y transform).
                entrada.target.classList.add("visible");
            }
        });
    });

    // Le decimos al observer que vigile cada una de las cajas por separado.
    cajas.forEach(caja => observer.observe(caja));
</script>

</body>
</html>
